# Malaysia/MYR example only. Review every value and action before enabling.
owner_configured: false
deep_work:
  minimum_hours: 4.0
sleep:
  baseline_hours: 7.5
  poor_sleep_duration_hours: 6.5
  poor_sleep_hrv_ratio: 0.9
  debt_window_days: 7
  debt_recovery_streak: 3
  ideal_range:
  - 7.5
  - 8.5
  poor_streak_alert: 3
  deep_min_range:
  - 60
  - 150
  rem_min_range:
  - 50
  - 140
  awake_min_warning: 40
  nap_compensation_min: 45
  hrv_warning_low: 30
readiness:
  hrv_rel_baseline_min: 0.85
  load_ratio_overtraining: 1.5
  tired_rate_warning: -30
energy:
  low_threshold: 4
  warning_threshold: 5
finance:
  savings_target_pct: 20
  weekly_spend_alert: 200.0
  daily_spend_alert: 25.0
wealth:
  maturity_alert_days: 30
  maturity_critical_days: 7
  staleness_warn_days: 30
  price_stale_days: 7
  rate_edge_min_pct: 0.25
  cap_utilization_warn: 0.9
  regulatory_rules_stale_days: 365
caffeine:
  cutoff_time: '14:00'
  late_cutoff_time: '16:00'
logging_defaults:
  enabled: true
  effective_from: '2026-08-17'
  energy_level: 7
  mental_load: 3
  deep_work_hours: 8.0
  deep_work_hours_weekend: 0.0
  caffeine_cutoff: '14:00'
  adherence: ✅
  daily_spend: 24.18
  coverage_warn_ratio: 0.6
  adherence_drift_days: 3
circuit_breakers:
- name: Sleep Critical
  description: 单日睡眠严重不足
  enforcement: auto
  condition:
    metric: sleep_duration
    operator: <
    value: 6.5
  actions:
  - 禁止晨跑，改为低心率快走或完全休息
  - 禁止大重量抗阻训练 (Deload only)
  - Deep Work 上限 4h，强制午休 20min
  - 22:00 强制断电零容忍
- name: Sleep Debt Level 1
  description: 7天滚动睡眠负债中度 (5-8h)
  enforcement: auto
  condition:
    metric: rolling_7d_sleep_debt
    operator: '>='
    value: 5.0
  actions:
  - 晨跑降级为 Zone 2 慢跑 (HR ≤ 145bpm, ≤ 30min)，禁止 Tempo/间歇
  - 抗阻训练降重 30% (Deload Mode)
  - 每日强制补午休 20-30min
  - 连续 3 天 ≥ 7.5h 睡眠后自动解除本级限制
- name: Sleep Debt Level 2
  description: 7天滚动睡眠负债严重 (>8h)
  enforcement: auto
  condition:
    metric: rolling_7d_sleep_debt
    operator: '>'
    value: 8.0
  actions:
  - 晨跑降级为低心率快走 (HR < 120bpm)，禁止一切跑步
  - 抗阻训练降重 50% 或改为纯徒手
  - 每日强制补午休 20-30min
  - 周末禁止安排任何产出目标
  - 降至 Level 1 后恢复 Zone 2 慢跑权限
- name: Energy Collapse
  description: 精力值跌破安全线
  enforcement: auto
  condition:
    metric: energy_level
    operator: <
    value: 4
  actions:
  - 当日立即取消所有训练
  - Deep Work 上限 2h，仅允许低认知任务
  - 提前至 21:30 执行断电协议
  - 次日晨间禁止跑步
- name: Mental Overload
  description: 心智负荷过载
  enforcement: auto
  condition:
    metric: mental_load
    operator: '>='
    value: 7
  actions:
  - 禁止当日安排额外会议或社交
  - Deep Work 切换为单任务模式 (禁止并行)
  - 强制插入 15min 散步/呼吸间隔 per 2h
  - 晚间禁止技术阅读，仅允许轻度娱乐
- name: Consecutive Poor Sleep
  description: 连续多日低质量睡眠
  enforcement: auto
  condition:
    metric: consecutive_poor_sleep
    operator: '>='
    value: 2
  actions:
  - 触发 System Offline 模式：次日视为恢复日
  - 禁止一切高强度训练直到录得 1 天 Fair+
  - 咖啡因窗口收紧至 10:00 前
  - Deep Work 上限 3h
- name: HRV Recovery Alert
  description: HRV 跌破恢复安全线，身体修复能力受损
  enforcement: auto
  condition:
    metric: hrv
    operator: <
    value: 30
  actions:
  - 当日禁止一切高强度训练，仅允许拉伸/快走
  - 强制午休 20-30min
  - 22:00 强制断电零容忍
  - 次日如 HRV 仍 < 30，触发 System Offline 恢复日
- name: Spending Surge
  description: 单笔大额消费预警
  enforcement: advisory
  condition:
    metric: single_transaction
    operator: '>'
    value: 30.0
  actions:
  - 日志中必须记录消费理由 (合理代偿/社交/冲动)
  - 当周剩余天数自炊率必须 ≥ 95%
  - 如本周已触发 2 次，锁定周末外食额度为 RM0
- name: Overtraining Warning
  description: ATI/CTI 急慢比过训预警
  enforcement: auto
  condition:
    metric: load_ratio
    operator: '>'
    value: 1.5
  actions:
  - 当日禁止安排额外训练，改为主动恢复 (拉伸/散步)
  - 下一次训练降重 30% 至 load_ratio < 1.3
  - 强制 8h 睡眠机会窗口
  - 次日 HRV 必须反弹至 baseline 以上才恢复训练
scoring:
  output_max: 40
  health_max: 30
  mental_max: 20
  habits_max: 10
  output:
    max_points: 40
    criteria:
      deep_work:
        formula: proportional
        target_hours: 30
        max_points: 25
      output_quality:
        formula: proportional
        target: 1.0
        max_points: 10
      blocker_management:
        formula: proportional
        target: 1.0
        max_points: 5
  health:
    max_points: 30
    criteria:
      avg_energy:
        formula: proportional
        target: 7
        max_points: 8
      poor_sleep_days:
        formula: threshold
        thresholds:
        - - 0
          - 10
        - - 1
          - 7
        - - 2
          - 4
        else_points: 1
        max_points: 10
      rolling_sleep_debt:
        formula: threshold
        thresholds:
        - - 3
          - 7
        - - 5
          - 5
        - - 10
          - 3
        else_points: 0
        max_points: 7
      sleep_structure:
        formula: proportional
        target: 1.0
        max_points: 3
      body_composition:
        formula: proportional
        target: 1.0
        max_points: 2
  mental:
    max_points: 20
    criteria:
      avg_mental_load:
        formula: threshold
        thresholds:
        - - 4
          - 10
        - - 6
          - 7
        - - 8
          - 4
        else_points: 1
        max_points: 10
      crisis_handling:
        formula: proportional
        target: 1.0
        max_points: 5
      emotional_resilience:
        formula: proportional
        target: 1.0
        max_points: 5
  habits:
    max_points: 10
    criteria:
      weekly_spend:
        formula: inverse_proportional
        target: 100.0
        scale: 150.0
        max_points: 5
      caffeine_compliance:
        formula: proportional
        target: 1.0
        max_points: 3
      sleep_duration_consistency:
        formula: threshold
        thresholds:
        - - 0.5
          - 2
        - - 0.75
          - 1
        else_points: 0
        max_points: 2
