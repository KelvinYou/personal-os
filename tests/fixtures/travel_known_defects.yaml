# Travel-plan defect corpus — the eval set for any travel review pipeline.
#
# Source: the v2 → v4 changelog of data/travel/shanghai-2026-11.md (§9 变更记录),
# which is the only labelled record we have of what human+AI review actually caught.
# Every entry below was a real defect that survived at least one generation pass.
#
# Purpose: no orchestration design (linter, verifier fan-out, adjudicator) ships
# until it can state how many of these it re-detects. A pipeline that cannot
# recover the `class: lint` entries mechanically is not worth its token cost.
#
# `class` — who should own the detection:
#   lint       deterministic, no model needed (scripts/travel_lint.py)
#   verify     needs an external source lookup (fan-out agent)
#   adjudicate the challenger was WRONG; the pipeline must be able to rule
#              "keep the original". These are the expensive ones.
#   judgment   a taste/trade-off call — keep it human, do not automate
#   process    repo/workflow hygiene, not trip content
#
# `rule` — for class: lint, the rule id in scripts/lib/travel/lint.py.
#   `rule: null` + `detectable: false` means we know it is lint-shaped but the
#   rule is not implemented yet. Do not delete these; they are the backlog.
#
# Chinese literals are quoted verbatim only where the string is itself the
# detection target (data/travel is the documented language exception).

meta:
  source_doc: data/travel/shanghai-2026-11.md
  changelog_versions: [v2, v3, v3.1, v3.2, v4]
  compiled: 2026-09-13
  total: 47

defects:
  # ---------------------------------------------------------------- v2
  - id: v2-01
    version: v2
    summary: Zhouzhuang cut, Tongli expanded to a full day
    class: judgment
    notes: Decided by the user after reading commercialisation evidence. Multi-agent
      debate would average this out, not improve it.

  - id: v2-02
    version: v2
    summary: Suzhou Museum closed on Mondays, collided with the Day 3 slot
    class: lint
    rule: null
    detectable: false
    notes: Lint-able only with a per-venue opening-hours table alongside the plan.
      Until that table exists this stays a verify-class lookup. High recurrence risk —
      closure-day collisions are the single most mechanical defect in the corpus.

  - id: v2-03
    version: v2
    summary: Last night moved to the PVG airport side
    class: judgment

  - id: v2-04
    version: v2
    summary: Visa-free policy stated incorrectly
    class: verify

  - id: v2-05
    version: v2
    summary: Electronic arrival/customs declaration card missing entirely
    class: verify
    notes: Omission, not a wrong statement. Fan-out verifiers detect wrong claims well
      and missing claims badly — needs a checklist-coverage prompt, not a claim check.

  - id: v2-06
    version: v2
    summary: Wuzhen ticket pricing basis stated incorrectly
    class: verify

  - id: v2-07
    version: v2
    summary: Lingyin admission confirmed free (was priced)
    class: verify

  - id: v2-08
    version: v2
    summary: Dual map links (高德 + Google) missing on place names
    class: lint
    rule: null
    detectable: false
    notes: Coverage rule — every first mention of a place name carries both links.
      Needs a place-name inventory to avoid firing on prose nouns.

  # ---------------------------------------------------------------- v3
  - id: v3-01
    version: v3
    summary: No direct Hangzhou East → Nanxun service; route rewritten via Hangzhou West
    class: verify

  - id: v3-02
    version: v3
    summary: Bus route 101 quoted as a 30-min hop; actually 33 stops / 47.6 km
    quote: "101 路公交"
    class: verify
    notes: Plausibility-checkable if distance is known — a 47.6 km surface bus cannot
      be 30 min. Candidate future lint rule `implausible_transit_speed`.

  - id: v3-03
    version: v3
    summary: Day 5 stated 10:30 and 10:45 for the same departure
    class: lint
    rule: timeline_monotonic
    detectable: true

  - id: v3-04
    version: v3
    summary: Wuzhen free admission depends on room type, not on staying in the area
    class: verify
    notes: Superseded and inverted again in v3.1-02. Two review rounds got it wrong
      in opposite directions — the most expensive single claim in the corpus.

  - id: v3-05
    version: v3
    summary: Arrival card "must be filed within 72 hours" — no such window exists
    quote: "72 小时"
    class: verify
    notes: Invented constraint. The generator produced a confident number with no source.
      Cheapest guard is `unsourced_specific`, which forces a ✅/❓ marker on any hard number.

  - id: v3-06
    version: v3
    summary: 12306 passport verification is 3-5 working days, not hours
    class: verify
    notes: Challenged again in v3.2-08 and upheld — see that entry.

  - id: v3-07
    version: v3
    summary: WeChat Pay and Alipay BOTH may charge ~3% on foreign cards; the
      "switch to Alipay" advice was wrong
    class: verify

  - id: v3-08
    version: v3
    summary: Lion Grove Garden requires real-name booking (was marked "待确认"); ¥30
    class: verify

  - id: v3-09
    version: v3
    summary: >-
      Overclaim — "Humble Administrator's Garden sells no tickets on site at all",
      when a foreign-visitor counter exists
    quote: "现场完全不售票"
    class: lint
    rule: null
    detectable: false
    notes: Absolutism detector — 完全/绝对/一定/从不 on an unsourced line. Cheap to add,
      expect a high false-positive rate; ship it as WARN only.

  - id: v3-10
    version: v3
    summary: West Lake boat ticket sales stop 16:30; sunset 17:08 — plan pushed to 14:45
    class: verify

  - id: v3-11
    version: v3
    summary: Day 3 departure relaxed to 10:10; Tongli given a Metro Line 4 fallback
    class: judgment

  - id: v3-12
    version: v3
    summary: Malaysian consulate details incomplete (no 24h emergency line)
    class: verify

  - id: v3-13
    version: v3
    summary: Seasonality wrong — no 三虾面 and no tea-picking in November; hairy crab
      is the actual season
    class: verify
    notes: Season-vs-date mismatch. A dedicated calendar/seasonality agent is the right
      owner; general verifiers skip this because nothing looks false in isolation.

  - id: v3-14a
    version: v3
    summary: '"9 天 5 地" contradicted the itinerary — actually 6 stops'
    quote: "9 天 5 地"
    class: lint
    rule: count_consistency
    detectable: true

  - id: v3-14b
    version: v3
    summary: '"6 家酒店" contradicted the itinerary — actually 5 lodgings'
