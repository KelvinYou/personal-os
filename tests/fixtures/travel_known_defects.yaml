  - id: v3.1-09
    version: v3.1
    summary: AGENTS.md missing the /data/travel/ directory contract + language exception
    class: process

  - id: v3.1-10
    version: v3.1
    summary: data/ was an uninitialised gitlink; the plan was tracked by no repo
