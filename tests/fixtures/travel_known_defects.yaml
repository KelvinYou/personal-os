  # ---------------------------------------------------------------- v3.1
  - id: v3.1-01
    version: v3.1
    summary: PVG queue figure sourced from a 2009 pre-Expo press release (17 years stale,
      and airline-specific); current official limits are 40-80 min
    class: verify
    severity_in_source: critical
    notes: Staleness, not falsity — the quoted sentence was real. Verifier prompts must
      demand a publication date, not just a URL.

  - id: v3.1-02
    version: v3.1
    summary: Wuzhen booking advice was inverted — rooms LABELLED "含西栅门票" are the
      ones OUTSIDE the scenic area; inside-area rooms carry no such label
    quote: "含西栅门票"
    class: verify
    severity_in_source: critical
    notes: The label means the opposite of its plain reading. No amount of careful
      generation catches this; only fetching the booking page does.

  - id: v3.1-03
    version: v3.1
    summary: Intercity legs counted as "高铁 4 段" against a 3-row table; real total is
      3 rail + 2 coach = 5 legs
    class: lint
    rule: count_consistency
    detectable: true
    notes: The reviewer's own correction ("4 段长途") was ALSO wrong — it missed the
      Wuzhen→Hangzhou coach. Arithmetic is the one thing not to delegate to a model.

  - id: v3.1-04
    version: v3.1
    summary: 12306 advance sale is 15 days including the travel date, so a single
      10/17 booking checkpoint is infeasible; split into 4 dated checkpoints
    class: lint
    rule: null
    detectable: false
    notes: Date arithmetic against a configured advance-sale window. Implementable once
      booking windows live in config — this is the highest-value unimplemented rule.

  - id: v3.1-05
    version: v3.1
    summary: Wuzhen → Hangzhou coach is 120 min (plan said 1-1.5 h, optimistic)
    class: verify

  - id: v3.1-06
    version: v3.1
    summary: Official Wuzhen coach runs from 苏州旅游集散中心, not 苏州汽车北站
    class: verify

  - id: v3.1-07
    version: v3.1
    summary: Trip.com charges HK$10-40 per rail ticket despite a "No booking fee" badge
    class: verify

  - id: v3.1-08
    version: v3.1
    summary: 12306 page does not itself state the 3-5 working day figure; attribution
      to the rail passenger bureau reply holds
    class: adjudicate
    ruling: keep_original_with_source_note
    notes: First case where the correct action was neither accept nor reject but
