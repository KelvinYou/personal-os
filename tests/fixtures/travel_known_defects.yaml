  - id: v4-04
    version: v4
    summary: 'Red-eye date trap: the ticket reads 11/8 00:10, but the traveller must be
      at PVG on the evening of 11/7. Check-in closes 11/7 23:10.'
    class: lint
    rule: redeye_date_trap
    detectable: true
    severity_in_source: critical
    notes: The single highest-consequence defect in the corpus — missing it costs the
      trip, not a detour. Purely mechanical to detect.

  - id: v4-05
    version: v4
    summary: Day 8 has no hotel, so luggage must be carried all day; four strategies
      given
    class: lint
    rule: null
    detectable: false
    notes: >-
      State-continuity rule — every night maps to a lodging or an explicit
      "none (red-eye)", and luggage location is continuous across the day chain.
      Worth building, since it generalises to every multi-city plan.

