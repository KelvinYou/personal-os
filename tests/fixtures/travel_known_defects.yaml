  # ---------------------------------------------------------------- v3.2
  - id: v3.2-01
    version: v3.2
    summary: Backup taken at 16:52 was stale by 17:10; checksums differed
    class: process

  - id: v3.2-02
    version: v3.2
    summary: Re-verify checklist heading still said "4 段长途" after the body was
      corrected to 5 intercity legs
    class: lint
    rule: count_consistency
    detectable: true
    notes: Classic post-edit drift — the fix landed in the body, not in the summary.

  - id: v3.2-03
    version: v3.2
    summary: Overview table still said "班车 1-1.5 h" while the body said 120 min
    class: lint
    rule: table_body_agreement
    detectable: true

  - id: v3.2-04
    version: v3.2
    summary: Checklist still referenced the 10:40 departure after it was deleted
    class: lint
    rule: dangling_reference
    detectable: true

  - id: v3.2-05
    version: v3.2
    summary: No official timetable exists for Suzhou → Wuzhen at all; the "13:20"
      departure was back-derived from the 13:15 Wuzhen-origin service
    quote: "13:20"
    class: lint
    rule: unsourced_specific
    detectable: true
    severity_in_source: critical
    notes: The generator invented a precise time by arithmetic on a real one. This is
      the defect shape most likely to recur, and the cheapest to block mechanically.

  - id: v3.2-06
    version: v3.2
    summary: The long-distance coach terminates at Xizha itself; the "transfer to a
      scenic-area shuttle" step was invented
    class: verify

  - id: v3.2-07
    version: v3.2
    summary: 'Challenger claimed "FM check-in closes 40 min before departure at PVG".
      Wrong venue — that figure is the Hongqiao T1 entry. The original 60 min stood,
      and v3.1 had already over-corrected by deleting a valid caveat.'
    class: adjudicate
    ruling: restore_original
    severity_in_source: critical
    notes: THE reference case for why findings must not auto-apply. A review round
      deleted correct content because a challenger sounded confident. Any pipeline that
      applies verifier output directly reproduces this defect by construction.

  - id: v3.2-08
    version: v3.2
    summary: 'Challenger claimed the 3-5 working day figure was unsourced; the four
      ?no=1..4 parameter pages are byte-identical and 25 FAQ entries never say
      "工作日" — the challenger''s quoted sentence does not exist anywhere.'
    class: adjudicate
    ruling: keep_original
    notes: Challenger hallucinated a citation. Adjudicator must be able to check that
      the challenger's own quote is real, not just that it is plausible.

  - id: v3.2-09
    version: v3.2
    summary: Wuzhen → Hangzhou switched to the genuine 10:20 service; all 13 official
