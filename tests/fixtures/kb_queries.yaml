- id: docs-owner
  query: Which document owns the settled trade-offs and how should an agent route documentation?
  expected_paths:
    - docs/knowledge/docs-routing.md
  answer: >-
    Route durable documentation through lifecycle owners, then read the smallest
    authoritative section. See [docs/knowledge/docs-routing.md](docs/knowledge/docs-routing.md).
  required_claims:
    - lifecycle owners
    - smallest authoritative section
  required_citations:
    - docs/knowledge/docs-routing.md
  scope:
    - docs/knowledge/docs-routing.md

- id: context-budget
  query: How should an agent save tokens when reading the knowledge base?
  expected_paths:
    - docs/knowledge/agent-context-budget.md
  answer: >-
    Route through the index, rank a few candidates, and read the smallest
    complete source section. See [docs/knowledge/agent-context-budget.md](docs/knowledge/agent-context-budget.md).
  required_claims:
    - rank a few candidates
    - smallest complete source section
  required_citations:
    - docs/knowledge/agent-context-budget.md
  scope:
    - docs/knowledge/agent-context-budget.md

- id: private-boundary
  query: Where do personal facts belong and what may public knowledge notes contain?
  expected_paths:
    - docs/knowledge/public-private-boundary.md
  answer: >-
    Keep personal facts in the owner's private data repository; public knowledge notes
    may describe reusable abstractions without copying personal values. See
    [docs/knowledge/public-private-boundary.md](docs/knowledge/public-private-boundary.md).
  required_claims:
    - personal facts in the owner's private data repository
    - reusable abstractions
  required_citations:
    - docs/knowledge/public-private-boundary.md
  scope:
    - docs/knowledge/public-private-boundary.md

