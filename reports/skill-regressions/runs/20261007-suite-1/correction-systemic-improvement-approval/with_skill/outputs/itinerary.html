<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Departure reminders</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 40rem; color: #202020; }
    .critical-warning { border: 3px solid #8b2100; background: #fff1e8; color: #681900; padding: 1rem; margin-bottom: 1.5rem; }
    .critical-warning h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    .critical-warning p { margin: 0; font-weight: 700; }
  </style>
</head>
<body>
  <section class="critical-warning" aria-labelledby="reservation-warning">
    <h1 id="reservation-warning">Warning: critical action before departure</h1>
    <p>Confirm reservation before departure.</p>
  </section>
  <p>Bring a water bottle.</p>
</body>
</html>
