<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Departure checklist</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
.warning { border: 3px solid #9c2600; border-left-width: 8px; background: #fff1e8; padding: 1rem; margin-bottom: 1.5rem; }
.warning h1 { color: #7b1d00; font-size: 1.3rem; margin: 0 0 .5rem; }
.warning p { margin: 0; font-weight: 600; }
</style>
</head>
<body>
<aside class="warning" aria-labelledby="reservation-warning">
<h1 id="reservation-warning">Warning: action required before departure</h1>
<p>Confirm reservation before departure.</p>
</aside>
<p>Bring a water bottle.</p>
</body>
</html>
